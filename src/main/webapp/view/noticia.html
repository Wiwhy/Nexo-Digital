<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noticia - Nexo Digital</title>
    <link rel="icon" href="img/favicon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css?">
</head>

<body>

    <header class="cabecera-principal">
        <div class="contenedor-header">
            <a href="index.html" class="logo-link">
                <h1>Nexo Digital</h1>
            </a>
        </div>
    </header>

    <main class="contenedor-principal" id="seccion-noticia">
        <article class="noticia-completa">
            <h2 id="noticia-titulo">Cargando...</h2>
            <div id="noticia-meta" class="meta-noticia"></div>
            <img id="noticia-imagen" src="" alt="Imagen de la noticia" class="imagen-hero" style="display:none;">
            <div id="noticia-cuerpo" class="cuerpo-texto"></div>
        </article>
    </main>

    <footer class="pie-pagina">
        <div class="contenedor-footer">
            <a href="legal.html" class="btn-texto-azul">Política de privacidad y aviso legal</a>
            <div id="controles-publicos">
                <button id="btn-abrir-login" class="btn-texto-azul">Admin</button>
            </div>
            <div id="controles-admin" style="display:none;">
                <a href="admin.html" class="btn-texto-azul">Panel de admin</a>
            </div>
        </div>
    </footer>

    <div id="modal-login" class="modal" style="display:none;">
        <div class="modal-contenido">
            <span class="cerrar" id="btn-cerrar-login">&times;</span>
            <h2>Acceso administrador</h2>
            <form id="form-login">
                <div class="grupo-input">
                    <label for="usuario">Usuario:</label>
                    <input type="text" id="usuario" name="usuario" required>
                </div>
                <div class="grupo-input">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn-azul btn-grande">Entrar</button>
            </form>
        </div>
    </div>

    <script src="js/noticia.js"></script>
</body>

</html>
