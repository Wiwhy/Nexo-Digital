<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noticia - Nexo Digital</title>
    <link rel="icon" href="img/favicon.png?v=2" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css?v=14">
</head>

<body>

    <header class="cabecera-principal">
        <div class="contenedor-header">
            <a href="index.html" class="logo-link">
                <h1>Nexo Digital</h1>
            </a>
        </div>
    </header>

    <main class="contenedor-principal" id="seccion-noticia">
        <article class="noticia-completa">

            <h2 id="titulo-noticia">Cargando...</h2>

            <div id="metadatos-noticia" class="meta-noticia"></div>

            <img id="campo-archivo-imagen" src="" alt="Imagen de la noticia" class="imagen-hero" style="display:none;">

            <div id="cuerpo-noticia" class="cuerpo-texto"></div>

        </article>
    </main>

    <footer class="pie-pagina">
        <div class="contenedor-footer">
            <a href="legal.html" class="btn-texto-azul">Política de privacidad y aviso legal</a>

            <div id="controles-publico">
                
                <button id="boton-abrir-login" class="btn-texto-azul">Admin</button>
            </div>

            <div id="controles-administrador" style="display:none;">
                <a href="admin.html" class="btn-texto-azul">Panel de admin</a>
            </div>
        </div>
    </footer>

    <div id="ventana-emergente-login" class="modal" style="display:none;">
        <div class="modal-contenido">
            <button class="cerrar" id="boton-cerrar-login">&times;</button>
            <h2>Acceso administrador</h2>
            <form id="formulario-login">
                <div class="grupo-input">
                    <label for="campo-usuario">Usuario:</label>
                    <input type="text" id="campo-usuario" name="usuario" required>
                </div>
                <div class="grupo-input">
                    <label for="campo-contrasena">Contraseña:</label>
                    <input type="password" id="campo-contrasena" name="password" required>
                </div>
                <button type="submit" class="btn-azul boton-grande">Entrar</button>
            </form>
        </div>
    </div>

    <script src="js/noticia.js?v=2"></script>
</body>

</html>
