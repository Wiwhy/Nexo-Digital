<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de administración - Nexo Digital</title>
    <link rel="icon" href="img/favicon.png?v=2" type="image/png">
    <link rel="stylesheet" href="css/estilos.css?v=9">
    <link rel="stylesheet" href="css/admin.css?v=9">
</head>

<body>

    <header class="cabecera-principal">
        <div class="contenedor-header">
            <a href="index.html" class="logo-link">
                <h1>Nexo Digital ⚙️</h1>
            </a>
        </div>
    </header>

    <main class="contenedor-principal">
        <div class="tarjeta-admin">
            <div class="encabezado-admin">
                <h2>Gestión de noticias</h2>
                <button class="btn-azul btn-pequeno" id="btn-nueva-noticia">Crear</button>
            </div>

            <div id="lista-noticias" class="lista-admin">
            </div>
        </div>
    </main>

    <footer class="pie-pagina">
        <div class="contenedor-footer">
            <a href="legal.html" class="btn-texto-azul">Política de Privacidad y Aviso Legal</a>
            <a href="#" id="btn-logout" class="btn-texto-azul">Cerrar Sesión</a>
        </div>
    </footer>

    <div id="modal-noticia" class="modal" style="display:none;">
        <div class="modal-contenido">
            <span class="cerrar" id="btn-cerrar-modal-noticia">&times;</span>
            <h2 id="modal-noticia-titulo">Editar noticia</h2>

            <form id="form-noticia" enctype="multipart/form-data">
                <input type="hidden" name="id" id="noticia-id">

                <div class="grupo-input">
                    <label>Título:</label>
                    <input type="text" id="noticia-titulo-input" name="titulo" required>
                </div>

                <div class="grupo-input">
                    <label>Autor:</label>
                    <input type="text" id="noticia-autor-input" name="autor" required>
                </div>

                <div class="grupo-input">
                    <label>Contenido:</label>
                    <textarea id="noticia-contenido" name="contenido" required></textarea>
                </div>

                <div class="grupo-input">
                    <label>Imagen:</label>
                    <div style="position: relative; overflow: hidden; width: 100%; padding: 0.6rem; border-radius: var(--radio-inputs); background: #ebebeb; display: flex; align-items: center;">
                        <button type="button" style="background: #ffffff; border: 1px solid #cccccc; border-radius: 4px; padding: 0.2rem 0.6rem; font-size: 0.85rem; font-family: inherit; font-weight: 500; pointer-events: none; color: #000; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">Seleccionar archivo</button>
                        <span id="file-input-text" style="margin-left: 0.8rem; font-size: 0.9rem; color: #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: calc(100% - 150px);">Ningún archivo seleccionado</span>
                        <input type="file" id="noticia-imagen" name="imagen" accept="image/*" style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; opacity: 0; cursor: pointer; width: 100%;">
                    </div>
                </div>

                <div class="acciones-modal-flex">
                    <button type="submit" class="btn-azul btn-grande" id="btn-guardar-modal">Guardar</button>
                    <button type="button" class="btn-azul btn-grande" id="btn-eliminar-modal">Eliminar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/admin.js"></script>
</body>

</html>
