<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de administración - Nexo Digital</title>
    <link rel="icon" href="img/favicon.png?v=2" type="image/png">
    
    <link rel="stylesheet" href="css/estilos.css?v=14">
    
    <link rel="stylesheet" href="css/admin.css?v=14">
</head>

<body>

    <header class="cabecera-principal">
        <div class="contenedor-header">
            <a href="index.html" class="logo-link">
                <h1>Nexo Digital ⚙️</h1>
            </a>
        </div>
    </header>

    <main class="contenedor-principal">
        <div class="tarjeta-admin">

            <div class="encabezado-admin">
                <h2>Gestión de noticias</h2>

                <button class="btn-azul boton-grande" id="boton-nueva-noticia">Crear</button>
            </div>

            <div id="lista-noticias" class="lista-admin">
            </div>

        </div>
    </main>

    <footer class="pie-pagina">
        <div class="contenedor-footer">
            <a href="legal.html" class="btn-texto-azul">Política de Privacidad y Aviso Legal</a>

            <a href="#" id="boton-cerrar-sesion" class="btn-texto-azul">Cerrar Sesión</a>
        </div>
    </footer>

    <div id="ventana-emergente-noticia" class="modal" style="display:none;">
        <div class="modal-contenido">
            <button class="cerrar" id="boton-cerrar-modal-noticia">&times;</button>

            <h2 id="titulo-ventana-emergente">Editar noticia</h2>

            <form id="formulario-noticia" enctype="multipart/form-data">

                <input type="hidden" name="id" id="campo-oculto-id">

                <div class="grupo-input">
                    <label for="campo-titulo">Título:</label>
                    <input type="text" id="campo-titulo" name="titulo" required>
                </div>

                <div class="grupo-input">
                    <label for="campo-autor">Autor:</label>
                    <input type="text" id="campo-autor" name="autor" required>
                </div>

                <div class="grupo-input">
                    <label for="campo-contenido">Contenido:</label>
                    <textarea id="campo-contenido" name="contenido" required></textarea>
                </div>

                <div class="grupo-input">
                    <label for="campo-archivo-imagen">Imagen:</label>
                    <div class="file-input-wrapper">
                        <button type="button" class="file-input-btn">Seleccionar archivo</button>
                        <span id="texto-nombre-archivo" class="file-input-text">Ningún archivo seleccionado</span>
                        <input type="file" id="campo-archivo-imagen" name="imagen" accept="image/*" class="file-input-real">
                    </div>
                </div>

                <div class="acciones-modal-flex">
                    
                    <button type="submit" class="btn-azul boton-grande" id="boton-guardar-noticia">Guardar</button>

                    <button type="button" class="btn-azul boton-grande" id="boton-eliminar-noticia">Eliminar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/admin.js?v=2"></script>
</body>

</html>
